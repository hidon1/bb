<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>גלריה ראשית עם תמונות קטנות</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 30px 15px;
    }

    .gallery {
      max-width: 1100px;
      margin: auto;
    }

    .main {
      position: relative;
      height: 520px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      margin-bottom: 20px;
    }

    .main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.35s ease;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .arrow.right { right: 16px; }
    .arrow.left { left: 16px; }

    .thumbs-wrap {
      overflow: hidden;
    }

    .thumbs {
      display: flex;
      gap: 14px;
      transition: transform 0.45s ease;
    }

    .thumb {
      min-width: calc((100% - 42px) / 4);
      height: 130px;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.75;
      border: 2px solid transparent;
      transition: 0.25s;
      flex-shrink: 0;
    }

    .thumb.active {
      opacity: 1;
      border-color: #60a5fa;
      transform: translateY(-3px);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 700px) {
      .main { height: 320px; }
      .thumb { min-width: calc((100% - 14px) / 2); }
    }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="main">
      <button class="arrow right" id="prev4">❯</button>
      <img id="mainImage4" src="https://picsum.photos/id/1060/1200/800" alt="">
      <button class="arrow left" id="next4">❮</button>
    </div>

    <div class="thumbs-wrap">
      <div class="thumbs" id="thumbs4">
        <div class="thumb active"><img src="https://picsum.photos/id/1060/500/300"></div>
        <div class="thumb"><img src="https://picsum.photos/id/1061/500/300"></div>
        <div class="thumb"><img src="https://picsum.photos/id/1062/500/300"></div>
        <div class="thumb"><img src="https://picsum.photos/id/1063/500/300"></div>
        <div class="thumb"><img src="https://picsum.photos/id/1064/500/300"></div>
        <div class="thumb"><img src="https://picsum.photos/id/1065/500/300"></div>
      </div>
    </div>
  </div>

  <script>
    const big4 = document.getElementById('mainImage4');
    const thumbs4 = [...document.querySelectorAll('.thumb')];
    let index4 = 0;

    function update4() {
      thumbs4.forEach(t => t.classList.remove('active'));
      thumbs4[index4].classList.add('active');
      big4.src = thumbs4[index4].querySelector('img').src.replace('/500/300', '/1200/800');
    }

    document.getElementById('prev4').onclick = () => {
      index4 = (index4 - 1 + thumbs4.length) % thumbs4.length;
      update4();
    };

    document.getElementById('next4').onclick = () => {
      index4 = (index4 + 1) % thumbs4.length;
      update4();
    };

    thumbs4.forEach((thumb, i) => {
      thumb.onclick = () => {
        index4 = i;
        update4();
      };
    });
  </script>
</body>
</html>
