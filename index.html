<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok - בונה אתרים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            color-scheme: light;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #c7d2fe #eef2ff;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #dbeafe 0%, #f8fafc 45%, #eef2ff 100%);
            color: #111827;
            margin: 0;
        }

        .app-shell {
            max-width: 1700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            gap: 16px;
            padding: 14px;
            box-sizing: border-box;
        }

        .history-panel {
            width: 300px;
            min-width: 250px;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid #dbeafe;
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-container {
            height: calc(100vh - 160px);
        }

        .message-bubble {
            max-width: min(92%, 1100px);
            padding: 14px 20px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
            line-height: 1.55;
        }

        .user-bubble {
            background: linear-gradient(120deg, #2563eb, #4f46e5);
            color: #ffffff;
            border-bottom-right-radius: 6px;
            border: none;
        }

        .assistant-bubble {
            background: #ffffff;
            color: #111827;
            border-bottom-left-radius: 6px;
            width: min(100%, 1220px);
        }

        .code-card {
            background: #f8fafc;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            overflow: hidden;
            margin: 14px 0;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            background: linear-gradient(120deg, #eff6ff, #eef2ff);
            border-bottom: 1px solid #dbeafe;
            font-size: 12px;
            color: #1e3a8a;
        }

        .code-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #c7d2fe;
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            color: #3730a3;
            border-radius: 999px;
            padding: 6px 13px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(145deg, #eef2ff, #ffffff);
            box-shadow: 0 8px 14px rgba(79, 70, 229, 0.16);
        }

        pre {
            margin: 0;
            padding: 14px;
            color: #111827;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
            background: #fbfdff;
        }

        .drawer {
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform-origin: top right;
        }

        .drawer.hidden-panel {
            transform: translateY(-8px) scale(0.96);
            opacity: 0;
            pointer-events: none;
        }

        .chat-item {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-item:hover,
        .chat-item.active {
            border-color: #818cf8;
            background: #eef2ff;
        }

        @media (max-width: 1024px) {
            .app-shell {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .history-panel {
                width: 100%;
                max-width: none;
                min-width: 0;
                max-height: 240px;
            }

            .chat-container {
                height: calc(100vh - 390px);
                min-height: 340px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="history-panel p-4">
            <button onclick="createNewChat()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 px-4 flex items-center justify-center gap-2 shadow-md shadow-indigo-200">
                <i class="fa-solid fa-plus"></i>
                <span>צ'אט חדש</span>
            </button>
            <div class="mt-4 flex items-center justify-between">
                <h2 class="font-semibold text-slate-800">השיחות שלך</h2>
                <span id="chats-count" class="text-xs bg-indigo-100 text-indigo-700 rounded-full px-2 py-1">0</span>
            </div>
            <div id="chat-list" class="mt-3 space-y-2 overflow-y-auto pr-1"></div>
        </aside>

        <div class="chat-workspace">
            <header class="bg-white/90 backdrop-blur border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-2xl">G</div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-semibold text-slate-900">בונה אתרים עם Grok</h1>
                        <p class="text-slate-500 text-sm">ממשק מקצועי, שיחות שמורות, ושיתוף מלא</p>
                    </div>
                </div>
                <div class="relative">
                    <button onclick="toggleMenu()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-full text-sm text-slate-700">
                        <i class="fa-solid fa-bars"></i>
                        <span>תפריט</span>
                    </button>
                    <section id="top-menu" class="drawer hidden-panel absolute left-0 top-14 w-72 bg-white border border-slate-200 rounded-2xl p-4 shadow-lg z-20">
                        <h2 class="font-semibold text-slate-900 mb-3">אפשרויות</h2>
                        <div class="space-y-2 text-sm">
                            <button onclick="openSettings()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-gear ml-2 text-indigo-500"></i> הגדרות
                            </button>
                            <button onclick="openContact()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-envelope ml-2 text-indigo-500"></i> יצירת קשר (מייל)
                            </button>
                            <button onclick="openPremium()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-crown ml-2 text-amber-500"></i> מנוי פרימיום (בקרוב)
                            </button>
                            <button onclick="clearChat()" class="w-full text-right bg-red-50 hover:bg-red-100 border border-red-100 text-red-700 rounded-xl p-3">
                                <i class="fa-solid fa-trash ml-2"></i> נקה שיחה נוכחית
                            </button>
                        </div>
                    </section>
                </div>
            </header>

            <main id="chat-messages" class="chat-container p-4 sm:p-6 overflow-y-auto flex flex-col gap-5 mt-3 bg-white border border-slate-200 rounded-2xl shadow-sm"></main>

            <div class="my-3 p-3 sm:p-4 border border-slate-200 bg-white rounded-2xl shadow-sm">
                <form id="chat-form" class="flex gap-3 items-center">
                    <input id="user-input"
                           type="text"
                           class="flex-1 bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-full px-6 py-4 outline-none text-base text-slate-900"
                           placeholder="תאר את האתר שתרצה לבנות או לשפר...">
                    <button type="button" onclick="shareChat()" class="bg-emerald-500 hover:bg-emerald-600 w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-emerald-200" title="שתף צ'אט">
                        <i class="fa-solid fa-share-nodes text-white text-xl"></i>
                    </button>
                    <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-indigo-200">
                        <i class="fa-solid fa-paper-plane text-white text-xl"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'grok_chats_v2';

        let chats = [];
        let activeChatId = null;

        const chatMessages = document.getElementById('chat-messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const topMenu = document.getElementById('top-menu');
        const chatList = document.getElementById('chat-list');
        const chatsCount = document.getElementById('chats-count');

        function toggleMenu() {
            topMenu.classList.toggle('hidden-panel');
        }

        function getCurrentChat() {
            return chats.find(chat => chat.id === activeChatId);
        }

        function saveChats() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
            renderChatList();
        }

        function loadChats() {
            try {
                chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch (_) {
                chats = [];
            }

            if (!chats.length) {
                const starter = {
                    id: crypto.randomUUID(),
                    title: 'שיחה חדשה',
                    updatedAt: Date.now(),
                    messages: []
                };
                chats.push(starter);
            }

            activeChatId = chats[0].id;
            renderChatList();
            renderMessages();
        }

        function renderChatList() {
            chats.sort((a, b) => b.updatedAt - a.updatedAt);
            chatsCount.textContent = chats.length;

            chatList.innerHTML = chats.map(chat => {
                const isActive = chat.id === activeChatId;
                const subtitle = chat.messages[0]?.content?.slice(0, 26) || 'אין הודעות עדיין';
                return `<div class="chat-item ${isActive ? 'active' : ''}" onclick="switchChat('${chat.id}')">
                    <div class="font-medium text-sm text-slate-800">${escapeHtml(chat.title)}</div>
                    <div class="text-xs text-slate-500 mt-1">${escapeHtml(subtitle)}</div>
                </div>`;
            }).join('');
        }

        function switchChat(chatId) {
            activeChatId = chatId;
            renderChatList();
            renderMessages();
        }

        function createNewChat() {
            const chat = {
                id: crypto.randomUUID(),
                title: `שיחה חדשה ${chats.length + 1}`,
                updatedAt: Date.now(),
                messages: []
            };
            chats.unshift(chat);
            activeChatId = chat.id;
            saveChats();
            renderMessages();
        }

        function addMessage(role, content) {
            const currentChat = getCurrentChat();
            currentChat.messages.push({ role, content });
            if (currentChat.messages.length === 1 && role === 'user') {
                currentChat.title = content.slice(0, 34);
            }
            currentChat.updatedAt = Date.now();
            saveChats();
            renderMessages();
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderMessages() {
            const currentChat = getCurrentChat();
            if (!currentChat?.messages.length) {
                renderWelcome();
                return;
            }

            chatMessages.innerHTML = '';
            currentChat.messages.forEach(({ role, content }) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

                if (role === 'user') {
                    messageDiv.innerHTML = `<div class="message-bubble user-bubble">${escapeHtml(content)}</div>`;
                } else {
                    messageDiv.innerHTML = `
                        <div class="flex gap-3 items-start max-w-full w-full">
                            <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-blue-500 rounded-2xl flex-shrink-0 flex items-center justify-center text-white text-sm mt-1">G</div>
                            <div class="assistant-bubble message-bubble max-w-none">
                                ${formatMessage(content)}
                            </div>
                        </div>
                    `;
                }
                chatMessages.appendChild(messageDiv);
            });
        }

        function formatMessage(content) {
            const regex = /```(?:html)?\n([\s\S]*?)```/g;
            const parts = [];
            let lastIndex = 0;
            let match;

            while ((match = regex.exec(content)) !== null) {
                const textPart = content.slice(lastIndex, match.index);
                if (textPart) {
                    parts.push(escapeHtml(textPart).replace(/\n/g, '<br>'));
                }

                const escapedCode = escapeHtml(match[1].trim());
                parts.push(`<div class="code-card">
                    <div class="code-header">
                        <span>קובץ HTML מוכן לשימוש</span>
                        <div class="code-actions">
                            <button onclick="copyCode(this)" class="action-btn">
                                <i class="fa-solid fa-copy"></i> העתק
                            </button>
                            <button onclick="downloadCode(this)" class="action-btn">
                                <i class="fa-solid fa-download"></i> הורד
                            </button>
                        </div>
                    </div>
                    <pre><code>${escapedCode}</code></pre>
                </div>`);

                lastIndex = regex.lastIndex;
            }

            const tail = content.slice(lastIndex);
            if (tail) {
                parts.push(escapeHtml(tail).replace(/\n/g, '<br>'));
            }

            return parts.join('');
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.copyCode = function(button) {
            const text = button.closest('.code-card').querySelector('pre code').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const original = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check"></i> הועתק';
                setTimeout(() => button.innerHTML = original, 1600);
            });
        };

        window.downloadCode = function(button) {
            const text = button.closest('.code-card').querySelector('pre code').textContent;
            const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `grok-site-${Date.now()}.html`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);

            const original = button.innerHTML;
            button.innerHTML = '<i class="fa-solid fa-circle-check"></i> ירד בהצלחה';
            setTimeout(() => button.innerHTML = original, 1600);
        };

        function exportChatHtml() {
            const currentChat = getCurrentChat();
            const rows = currentChat.messages.map(msg => `
                <article style="margin:12px 0;padding:14px;border-radius:12px;border:1px solid #e2e8f0;background:${msg.role === 'user' ? '#dbeafe' : '#fff'}">
                    <h4 style="margin:0 0 8px 0;font-family:Arial">${msg.role === 'user' ? 'משתמש' : 'עוזר'}</h4>
                    <div style="white-space:pre-wrap;font-family:Arial">${escapeHtml(msg.content)}</div>
                </article>
            `).join('');

            return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>${escapeHtml(currentChat.title)}</title></head><body style="font-family:Arial;background:#f8fafc;padding:20px"><h2>ייצוא צ'אט: ${escapeHtml(currentChat.title)}</h2>${rows}</body></html>`;
        }

        window.shareChat = async function() {
            const currentChat = getCurrentChat();
            if (!currentChat || !currentChat.messages.length) {
                alert('אין תוכן לשיתוף כרגע.');
                return;
            }

            const htmlContent = exportChatHtml();
            const file = new File([htmlContent], `chat-export-${Date.now()}.html`, { type: 'text/html' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: 'שיתוף צ׳אט',
                    text: 'מצורף קובץ HTML של הצ׳אט.',
                    files: [file]
                });
                return;
            }

            const url = URL.createObjectURL(file);
            const choice = prompt('כתוב: 1 לוואטסאפ, 2 למייל, או כל דבר אחר להורדה בלבד');
            if (choice === '1') {
                window.open(`https://wa.me/?text=${encodeURIComponent('מצורף סיכום צ׳אט. הורד/י את הקובץ מהדפדפן: ' + url)}`, '_blank');
            } else if (choice === '2') {
                window.location.href = `mailto:?subject=${encodeURIComponent('ייצוא צ׳אט HTML')}&body=${encodeURIComponent('מצורף לינק לקובץ הצ׳אט (זמני): ' + url)}`;
            }

            const dl = document.createElement('a');
            dl.href = url;
            dl.download = file.name;
            dl.click();
        };

        async function sendMessage() {
            const userText = input.value.trim();
            if (!userText) return;

            addMessage('user', userText);
            input.value = '';

            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing';
            typingDiv.className = 'flex justify-start';
            typingDiv.innerHTML = `
                <div class="flex gap-3 items-start">
                    <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-blue-500 rounded-2xl flex items-center justify-center text-white text-sm mt-1">G</div>
                    <div class="bg-slate-100 border border-slate-200 rounded-2xl px-5 py-3 flex items-center gap-2">
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                        </div>
                        <span class="text-slate-500 text-sm">Grok חושב...</span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const currentChat = getCurrentChat();
                const res = await fetch('https://noisy-dust-c360.zm0548407450.workers.dev/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: currentChat.messages })
                });

                const data = await res.json();
                document.getElementById('typing')?.remove();

                if (data.content) {
                    addMessage('assistant', data.content);
                } else {
                    addMessage('assistant', 'שגיאה – בדוק שהשרת רץ.');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('typing')?.remove();
                addMessage('assistant', 'שגיאה בחיבור לשרת. ודא שהשרת זמין.');
            }
        }

        function clearChat() {
            const currentChat = getCurrentChat();
            if (!currentChat) return;
            if (confirm('לנקות את השיחה הנוכחית?')) {
                currentChat.messages = [];
                currentChat.title = 'שיחה חדשה';
                currentChat.updatedAt = Date.now();
                saveChats();
                renderWelcome();
            }
        }

        function renderWelcome() {
            chatMessages.innerHTML = `
                <div class="text-center text-slate-600 py-12">
                    <div class="mx-auto w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-3xl mb-4">✨</div>
                    <h2 class="text-2xl font-semibold text-slate-900">ברוך הבא! נבנה אתר יפה ומוכן להורדה</h2>
                    <p class="mt-2 max-w-2xl mx-auto">הצ׳אט עכשיו רחב יותר, שומר היסטוריה מלאה בלוקאל סטורג׳, מאפשר שיתוף כקובץ HTML, כולל תפריט המבורגר מקצועי עם הגדרות, יצירת קשר ומסלול פרימיום עתידי.</p>
                </div>
            `;
        }

        function openSettings() {
            alert('הגדרות יתווספו כאן בקרוב (תמיכה בעיצוב, מודל, ושפה).');
        }

        function openContact() {
            window.location.href = 'mailto:support@example.com?subject=יצירת קשר מאפליקציית Grok Builder';
        }

        function openPremium() {
            alert('מנוי פרימיום יושק בהמשך: שמירת ענן, תבניות מתקדמות וחיבורים נוספים.');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        window.onload = loadChats;
    </script>
</body>
</html>
