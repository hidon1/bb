<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok - בונה אתרים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            color-scheme: light;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #c7d2fe #eef2ff;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #dbeafe 0%, #f8fafc 45%, #eef2ff 100%);
            color: #111827;
            margin: 0;
        }

        .app-shell {
            max-width: 1700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            gap: 16px;
            padding: 14px;
            box-sizing: border-box;
        }

        .history-panel {
            width: 300px;
            min-width: 250px;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid #dbeafe;
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-container {
            height: calc(100vh - 160px);
        }

        .message-bubble {
            max-width: min(92%, 1100px);
            padding: 14px 20px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
            line-height: 1.55;
        }

        .user-bubble {
            background: linear-gradient(120deg, #2563eb, #4f46e5);
            color: #ffffff;
            border-bottom-right-radius: 6px;
            border: none;
        }

        .assistant-bubble {
            background: #ffffff;
            color: #111827;
            border-bottom-left-radius: 6px;
            width: min(100%, 1220px);
        }

        .code-card {
            background: #f8fafc;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            overflow: hidden;
            margin: 14px 0;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            background: linear-gradient(120deg, #eff6ff, #eef2ff);
            border-bottom: 1px solid #dbeafe;
            font-size: 12px;
            color: #1e3a8a;
        }

        .code-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #c7d2fe;
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            color: #3730a3;
            border-radius: 999px;
            padding: 6px 13px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(145deg, #eef2ff, #ffffff);
            box-shadow: 0 8px 14px rgba(79, 70, 229, 0.16);
        }

        pre {
            margin: 0;
            padding: 14px;
            color: #111827;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
            background: #fbfdff;
        }

        .drawer {
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform-origin: top right;
        }

        .drawer.hidden-panel {
            transform: translateY(-8px) scale(0.96);
            opacity: 0;
            pointer-events: none;
        }

        .chat-item {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-item:hover,
        .chat-item.active {
            border-color: #818cf8;
            background: #eef2ff;
        }

        .chat-item.loading {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .status-pill {
            font-size: 10px;
            border-radius: 999px;
            padding: 2px 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-inline-start: 6px;
        }

        .status-pill.waiting {
            background: #fef3c7;
            color: #92400e;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .ghost-btn {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            border-radius: 999px;
            padding: 9px 14px;
            font-size: 13px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .ghost-btn:hover {
            transform: translateY(-1px);
            border-color: #c7d2fe;
            color: #312e81;
            background: #eef2ff;
        }

        .typing-min {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }

        .typing-min span {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #f59e0b;
            animation: pulseDots 1.2s infinite;
        }

        .typing-min span:nth-child(2) { animation-delay: 0.2s; }
        .typing-min span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulseDots {
            0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        @media (max-width: 1024px) {
            .app-shell {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .history-panel {
                width: 100%;
                max-width: none;
                min-width: 0;
                max-height: 240px;
            }

            .chat-container {
                height: calc(100vh - 390px);
                min-height: 340px;
            }
        }
    </style>
</head>
<body>
    <div id="auth-banner" class="max-w-5xl mx-auto mt-8 p-6 bg-white/95 border border-slate-200 rounded-3xl shadow-lg">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h2 class="text-2xl font-semibold text-slate-900">התחברות לחשבון</h2>
                <p class="text-slate-600 mt-1">כדי לשמור את כל השיחות שלך ב-Firebase Firestore, צריך להתחבר עם Google.</p>
            </div>
            <button id="google-login-btn" class="bg-white border border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 text-slate-800 rounded-full px-5 py-3 inline-flex items-center gap-2 self-start sm:self-auto">
                <i class="fa-brands fa-google text-red-500"></i>
                התחבר עם Google
            </button>
        </div>
    </div>

    <div id="app-shell" class="app-shell hidden">
        <aside class="history-panel p-4">
            <button onclick="createNewChat()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 px-4 flex items-center justify-center gap-2 shadow-md shadow-indigo-200">
                <i class="fa-solid fa-plus"></i>
                <span>צ'אט חדש</span>
            </button>
            <div class="mt-4 flex items-center justify-between">
                <h2 class="font-semibold text-slate-800">השיחות שלך</h2>
                <span id="chats-count" class="text-xs bg-indigo-100 text-indigo-700 rounded-full px-2 py-1">0</span>
            </div>
            <div id="chat-list" class="mt-3 space-y-2 overflow-y-auto pr-1"></div>
        </aside>

        <div class="chat-workspace">
            <header class="bg-white/90 backdrop-blur border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-2xl">G</div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-semibold text-slate-900">בונה אתרים עם Grok</h1>
                        <p class="text-slate-500 text-sm">שיחות ממשיכות לרוץ ברקע גם כשעוברים לצ׳אט אחר</p>
                    </div>
                </div>
                <div class="relative header-actions">
                    <div id="user-chip" class="hidden items-center gap-2 text-xs bg-slate-100 border border-slate-200 rounded-full px-3 py-2">
                        <i class="fa-regular fa-user"></i>
                        <span id="user-email"></span>
                    </div>
                    <button id="logout-btn" class="ghost-btn hidden">
                        <i class="fa-solid fa-right-from-bracket ml-1"></i> התנתק
                    </button>
                    <button onclick="duplicateCurrentChat()" class="ghost-btn">
                        <i class="fa-regular fa-clone ml-1"></i> שכפל שיחה
                    </button>
                    <button onclick="toggleMenu()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-full text-sm text-slate-700">
                        <i class="fa-solid fa-bars"></i>
                        <span>תפריט</span>
                    </button>
                    <section id="top-menu" class="drawer hidden-panel absolute left-0 top-14 w-72 bg-white border border-slate-200 rounded-2xl p-4 shadow-lg z-20">
                        <h2 class="font-semibold text-slate-900 mb-3">אפשרויות</h2>
                        <div class="space-y-2 text-sm">
                            <button onclick="openSettings()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-gear ml-2 text-indigo-500"></i> הגדרות
                            </button>
                            <button onclick="openContact()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-envelope ml-2 text-indigo-500"></i> יצירת קשר (מייל)
                            </button>
                            <button onclick="openPremium()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-crown ml-2 text-amber-500"></i> מנוי פרימיום (בקרוב)
                            </button>
                            <button onclick="clearChat()" class="w-full text-right bg-red-50 hover:bg-red-100 border border-red-100 text-red-700 rounded-xl p-3">
                                <i class="fa-solid fa-trash ml-2"></i> נקה שיחה נוכחית
                            </button>
                        </div>
                    </section>
                </div>
            </header>

            <main id="chat-messages" class="chat-container p-4 sm:p-6 overflow-y-auto flex flex-col gap-5 mt-3 bg-white border border-slate-200 rounded-2xl shadow-sm"></main>

            <div class="my-3 p-3 sm:p-4 border border-slate-200 bg-white rounded-2xl shadow-sm">
                <form id="chat-form" class="flex gap-3 items-center">
                    <input id="user-input"
                           type="text"
                           class="flex-1 bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-full px-6 py-4 outline-none text-base text-slate-900"
                           placeholder="תאר את האתר שתרצה לבנות או לשפר...">
                    <button type="button" onclick="shareChat()" class="bg-emerald-500 hover:bg-emerald-600 w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-emerald-200" title="שתף צ'אט">
                        <i class="fa-solid fa-share-nodes text-white text-xl"></i>
                    </button>
                    <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-indigo-200">
                        <i class="fa-solid fa-paper-plane text-white text-xl"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            onSnapshot,
            orderBy,
            query,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmkioVK9XKo2LJhN8EysPULxIpX81URR4",
            authDomain: "aiai-f4c2a.firebaseapp.com",
            projectId: "aiai-f4c2a",
            storageBucket: "aiai-f4c2a.firebasestorage.app",
            messagingSenderId: "815268198210",
            appId: "1:815268198210:web:214f510503e602327afadb",
            measurementId: "G-XPE90F1LS9"
        };

        const app = initializeApp(firebaseConfig);
        getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let chats = [];
        let activeChatId = null;
        let requestCounter = 0;
        let currentUser = null;
        let unsubscribeChats = null;
        const pendingByChat = new Map();

        const authBanner = document.getElementById('auth-banner');
        const appShell = document.getElementById('app-shell');
        const loginButton = document.getElementById('google-login-btn');
        const logoutButton = document.getElementById('logout-btn');
        const userChip = document.getElementById('user-chip');
        const userEmail = document.getElementById('user-email');
        const chatMessages = document.getElementById('chat-messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const topMenu = document.getElementById('top-menu');
        const chatList = document.getElementById('chat-list');
        const chatsCount = document.getElementById('chats-count');

        function toggleMenu() {
            topMenu.classList.toggle('hidden-panel');
        }

        function getCurrentChat() {
            return chats.find(chat => chat.id === activeChatId);
        }

        async function saveChatDoc(chat) {
            if (!currentUser) return;
            const safeMessages = Array.isArray(chat.messages) ? chat.messages : [];
            await setDoc(doc(db, 'users', currentUser.uid, 'chats', chat.id), {
                title: chat.title || 'שיחה חדשה',
                updatedAt: Date.now(),
                createdAt: chat.createdAt || Date.now(),
                messages: safeMessages
            }, { merge: true });
        }

        function subscribeToChats() {
            if (!currentUser) return;
            if (unsubscribeChats) unsubscribeChats();

            const chatsQuery = query(
                collection(db, 'users', currentUser.uid, 'chats'),
                orderBy('updatedAt', 'desc')
            );

            unsubscribeChats = onSnapshot(chatsQuery, async (snapshot) => {
                chats = snapshot.docs.map((item) => {
                    const data = item.data();
                    return {
                        id: item.id,
                        title: data.title || 'שיחה חדשה',
                        updatedAt: Number(data.updatedAt) || Date.now(),
                        createdAt: Number(data.createdAt) || Date.now(),
                        messages: Array.isArray(data.messages) ? data.messages : []
                    };
                });

                if (!chats.length) {
                    await createNewChat();
                    return;
                }

                if (!activeChatId || !chats.some(chat => chat.id === activeChatId)) {
                    activeChatId = chats[0].id;
                }

                renderChatList();
                renderMessages();
            }, (error) => {
                console.error('Firestore listener error:', error);
                alert('שגיאה בטעינת השיחות מ-Firebase. בדוק הרשאות Firestore.');
            });
        }

        function renderChatList() {
            chats.sort((a, b) => b.updatedAt - a.updatedAt);
            chatsCount.textContent = chats.length;

            chatList.innerHTML = chats.map(chat => {
                const isActive = chat.id === activeChatId;
                const subtitle = chat.messages[0]?.content?.slice(0, 26) || 'אין הודעות עדיין';
                const pendingRequests = pendingByChat.get(chat.id) || 0;

                return `<div class="chat-item ${isActive ? 'active' : ''} ${pendingRequests ? 'loading' : ''}" onclick="switchChat('${chat.id}')">
                    <div class="font-medium text-sm text-slate-800">
                        ${escapeHtml(chat.title)}
                        ${pendingRequests ? '<span class="status-pill waiting"><i class="fa-solid fa-rotate fa-spin"></i> חושב</span>' : ''}
                    </div>
                    <div class="text-xs text-slate-500 mt-1">${escapeHtml(subtitle)}</div>
                    ${pendingRequests ? '<div class="typing-min"><span></span><span></span><span></span></div>' : ''}
                </div>`;
            }).join('');
        }

        function switchChat(chatId) {
            activeChatId = chatId;
            renderChatList();
            renderMessages();
        }

        async function createNewChat() {
            if (!currentUser) return;
            const chat = {
                id: crypto.randomUUID(),
                title: `שיחה חדשה ${chats.length + 1}`,
                updatedAt: Date.now(),
                createdAt: Date.now(),
                messages: []
            };

            activeChatId = chat.id;
            await saveChatDoc(chat);
        }

        async function addMessage(role, content, chatId = activeChatId) {
            const currentChat = chats.find(chat => chat.id === chatId);
            if (!currentChat) return;
            currentChat.messages.push({ role, content });
            if (currentChat.messages.length === 1 && role === 'user') {
                currentChat.title = content.slice(0, 34);
            }
            currentChat.updatedAt = Date.now();
            await saveChatDoc(currentChat);

            if (chatId === activeChatId) {
                renderMessages();
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function renderMessages() {
            const currentChat = getCurrentChat();
            if (!currentChat?.messages.length) {
                renderWelcome();
                return;
            }

            chatMessages.innerHTML = '';
            currentChat.messages.forEach(({ role, content }) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

                if (role === 'user') {
                    messageDiv.innerHTML = `<div class="message-bubble user-bubble">${escapeHtml(content)}</div>`;
                } else {
                    messageDiv.innerHTML = `
                        <div class="flex gap-3 items-start max-w-full w-full">
                            <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-blue-500 rounded-2xl flex-shrink-0 flex items-center justify-center text-white text-sm mt-1">G</div>
                            <div class="assistant-bubble message-bubble max-w-none">
                                ${formatMessage(content)}
                            </div>
                        </div>
                    `;
                }
                chatMessages.appendChild(messageDiv);
            });
        }

        function formatMessage(content) {
            const regex = /```(?:html)?\n([\s\S]*?)```/g;
            const parts = [];
            let lastIndex = 0;
            let match;

            while ((match = regex.exec(content)) !== null) {
                const textPart = content.slice(lastIndex, match.index);
                if (textPart) {
                    parts.push(escapeHtml(textPart).replace(/\n/g, '<br>'));
                }

                const escapedCode = escapeHtml(match[1].trim());
                parts.push(`<div class="code-card">
                    <div class="code-header">
                        <span>קובץ HTML מוכן לשימוש</span>
                        <div class="code-actions">
                            <button onclick="copyCode(this)" class="action-btn">
                                <i class="fa-solid fa-copy"></i> העתק
                            </button>
                            <button onclick="downloadCode(this)" class="action-btn">
                                <i class="fa-solid fa-download"></i> הורד
                            </button>
                        </div>
                    </div>
                    <pre><code>${escapedCode}</code></pre>
                </div>`);

                lastIndex = regex.lastIndex;
            }

            const tail = content.slice(lastIndex);
            if (tail) {
                parts.push(escapeHtml(tail).replace(/\n/g, '<br>'));
            }

            return parts.join('');
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function setChatPending(chatId, isPending) {
            const current = pendingByChat.get(chatId) || 0;
            const nextValue = Math.max(0, current + (isPending ? 1 : -1));
            if (nextValue === 0) {
                pendingByChat.delete(chatId);
            } else {
                pendingByChat.set(chatId, nextValue);
            }
            renderChatList();
        }

        async function sendMessage() {
            const userText = input.value.trim();
            if (!userText || !currentUser) return;

            const chatId = activeChatId;
            await addMessage('user', userText, chatId);
            input.value = '';

            const requestId = `typing-${++requestCounter}`;
            const typingDiv = document.createElement('div');
            typingDiv.id = requestId;
            typingDiv.className = 'flex justify-start';
            typingDiv.innerHTML = `
                <div class="flex gap-3 items-start">
                    <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-blue-500 rounded-2xl flex items-center justify-center text-white text-sm mt-1">G</div>
                    <div class="bg-slate-100 border border-slate-200 rounded-2xl px-5 py-3 flex items-center gap-2">
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                        </div>
                        <span class="text-slate-500 text-sm">Grok חושב...</span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            setChatPending(chatId, true);

            try {
                const sourceChat = chats.find(chat => chat.id === chatId);
                const payloadMessages = [...(sourceChat?.messages || [])];
                const res = await fetch('https://noisy-dust-c360.zm0548407450.workers.dev/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: payloadMessages })
                });

                const data = await res.json();
                document.getElementById(requestId)?.remove();

                if (data.content) {
                    await addMessage('assistant', data.content, chatId);
                } else {
                    await addMessage('assistant', 'שגיאה – בדוק שהשרת רץ.', chatId);
                }
            } catch (err) {
                console.error(err);
                document.getElementById(requestId)?.remove();
                await addMessage('assistant', 'שגיאה בחיבור לשרת. ודא שהשרת זמין.', chatId);
            } finally {
                setChatPending(chatId, false);
                if (chatId === activeChatId) {
                    renderMessages();
                }
            }
        }

        async function clearChat() {
            const currentChat = getCurrentChat();
            if (!currentChat) return;
            if (confirm('לנקות את השיחה הנוכחית?')) {
                currentChat.messages = [];
                currentChat.title = 'שיחה חדשה';
                currentChat.updatedAt = Date.now();
                await saveChatDoc(currentChat);
                renderWelcome();
            }
        }

        function renderWelcome() {
            chatMessages.innerHTML = `
                <div class="text-center text-slate-600 py-12">
                    <div class="mx-auto w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-3xl mb-4">✨</div>
                    <h2 class="text-2xl font-semibold text-slate-900">ברוך הבא! כל הנתונים נשמרים בענן</h2>
                    <p class="mt-2 max-w-2xl mx-auto">השיחות שלך נשמרות ב-Firebase Firestore תחת החשבון האישי שלך. אפשר להתחבר מכל מכשיר ולראות את ההיסטוריה.</p>
                </div>
            `;
        }

        function openSettings() {
            alert('הגדרות יתווספו כאן בקרוב (תמיכה בעיצוב, מודל, ושפה).');
        }

        function openContact() {
            window.location.href = 'mailto:support@example.com?subject=יצירת קשר מאפליקציית Grok Builder';
        }

        function openPremium() {
            alert('מנוי פרימיום יושק בהמשך: שמירת ענן, תבניות מתקדמות וחיבורים נוספים.');
        }

        async function duplicateCurrentChat() {
            const currentChat = getCurrentChat();
            if (!currentChat || !currentUser) return;
            const clone = {
                ...currentChat,
                id: crypto.randomUUID(),
                title: `${currentChat.title} (עותק)`,
                messages: [...currentChat.messages],
                updatedAt: Date.now(),
                createdAt: Date.now()
            };
            activeChatId = clone.id;
            await saveChatDoc(clone);
        }

        function exportChatHtml() {
            const currentChat = getCurrentChat();
            const rows = currentChat.messages.map(msg => `
                <article style="margin:12px 0;padding:14px;border-radius:12px;border:1px solid #e2e8f0;background:${msg.role === 'user' ? '#dbeafe' : '#fff'}">
                    <h4 style="margin:0 0 8px 0;font-family:Arial">${msg.role === 'user' ? 'משתמש' : 'עוזר'}</h4>
                    <div style="white-space:pre-wrap;font-family:Arial">${escapeHtml(msg.content)}</div>
                </article>
            `).join('');

            return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>${escapeHtml(currentChat.title)}</title></head><body style="font-family:Arial;background:#f8fafc;padding:20px"><h2>ייצוא צ'אט: ${escapeHtml(currentChat.title)}</h2>${rows}</body></html>`;
        }

        async function shareChat() {
            const currentChat = getCurrentChat();
            if (!currentChat || !currentChat.messages.length) {
                alert('אין תוכן לשיתוף כרגע.');
                return;
            }

            const htmlContent = exportChatHtml();
            const file = new File([htmlContent], `chat-export-${Date.now()}.html`, { type: 'text/html' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: 'שיתוף צ׳אט',
                    text: 'מצורף קובץ HTML של הצ׳אט.',
                    files: [file]
                });
                return;
            }

            const url = URL.createObjectURL(file);
            const choice = prompt('כתוב: 1 לוואטסאפ, 2 למייל, או כל דבר אחר להורדה בלבד');
            if (choice === '1') {
                window.open(`https://wa.me/?text=${encodeURIComponent('מצורף סיכום צ׳אט. הורד/י את הקובץ מהדפדפן: ' + url)}`, '_blank');
            } else if (choice === '2') {
                window.location.href = `mailto:?subject=${encodeURIComponent('ייצוא צ׳אט HTML')}&body=${encodeURIComponent('מצורף לינק לקובץ הצ׳אט (זמני): ' + url)}`;
            }

            const dl = document.createElement('a');
            dl.href = url;
            dl.download = file.name;
            dl.click();
        }

        window.copyCode = function(button) {
            const text = button.closest('.code-card').querySelector('pre code').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const original = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check"></i> הועתק';
                setTimeout(() => button.innerHTML = original, 1600);
            });
        };

        window.downloadCode = function(button) {
            const text = button.closest('.code-card').querySelector('pre code').textContent;
            const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `grok-site-${Date.now()}.html`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);

            const original = button.innerHTML;
            button.innerHTML = '<i class="fa-solid fa-circle-check"></i> ירד בהצלחה';
            setTimeout(() => button.innerHTML = original, 1600);
        };

        async function signInWithGoogle() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error(error);
                alert('התחברות נכשלה. ודא ש-Google Sign-In פעיל ב-Firebase Authentication.');
            }
        }

        async function logout() {
            await signOut(auth);
        }

        loginButton.addEventListener('click', signInWithGoogle);
        logoutButton.addEventListener('click', logout);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            pendingByChat.clear();

            if (!user) {
                chats = [];
                activeChatId = null;
                chatList.innerHTML = '';
                chatsCount.textContent = '0';
                renderWelcome();
                authBanner.classList.remove('hidden');
                appShell.classList.add('hidden');
                userChip.classList.add('hidden');
                logoutButton.classList.add('hidden');
                userEmail.textContent = '';
                if (unsubscribeChats) unsubscribeChats();
                return;
            }

            authBanner.classList.add('hidden');
            appShell.classList.remove('hidden');
            userChip.classList.remove('hidden');
            logoutButton.classList.remove('hidden');
            userEmail.textContent = user.email || 'משתמש מחובר';
            subscribeToChats();
        });

        window.toggleMenu = toggleMenu;
        window.switchChat = switchChat;
        window.createNewChat = createNewChat;
        window.clearChat = clearChat;
        window.openSettings = openSettings;
        window.openContact = openContact;
        window.openPremium = openPremium;
        window.duplicateCurrentChat = duplicateCurrentChat;
        window.shareChat = shareChat;
    </script>
</body>
</html>
