<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בונה אתרים עם יזם אתרים</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="g" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop offset="0%25" stop-color="%232563eb"/%3E%3Cstop offset="50%25" stop-color="%237c3aed"/%3E%3Cstop offset="100%25" stop-color="%2314b8a6"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="64" height="64" rx="16" fill="url(%23g)"/%3E%3Ctext x="32" y="42" text-anchor="middle" font-size="34" font-family="Arial, sans-serif" font-weight="700" fill="white"%3E%D7%99%3C/text%3E%3C/svg%3E'>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            color-scheme: light;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: #c7d2fe #eef2ff;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #dbeafe 0%, #f8fafc 45%, #eef2ff 100%);
            color: #111827;
            margin: 0;
        }

        .app-shell {
            max-width: 1700px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            gap: 16px;
            padding: 14px;
            box-sizing: border-box;
        }

        .history-panel {
            width: 300px;
            min-width: 250px;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid #dbeafe;
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(30, 41, 59, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: conic-gradient(from 120deg, #2563eb, #7c3aed, #ec4899, #14b8a6, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            animation: logoSpin 8s linear infinite;
        }

        @keyframes logoSpin {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .chat-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-container {
            height: calc(100vh - 160px);
        }

        .message-bubble {
            max-width: min(92%, 1100px);
            padding: 14px 20px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
            line-height: 1.55;
        }

        .user-bubble {
            background: linear-gradient(120deg, #2563eb, #4f46e5);
            color: #ffffff;
            border-bottom-right-radius: 6px;
            border: none;
        }

        .assistant-bubble {
            background: #ffffff;
            color: #111827;
            border-bottom-left-radius: 6px;
            width: min(100%, 1220px);
        }

        .code-card {
            background: #f8fafc;
            border: 1px solid #dbeafe;
            border-radius: 16px;
            overflow: hidden;
            margin: 14px 0;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            background: linear-gradient(120deg, #eff6ff, #eef2ff);
            border-bottom: 1px solid #dbeafe;
            font-size: 12px;
            color: #1e3a8a;
        }

        .code-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #c7d2fe;
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            color: #3730a3;
            border-radius: 999px;
            padding: 6px 13px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(145deg, #eef2ff, #ffffff);
            box-shadow: 0 8px 14px rgba(79, 70, 229, 0.16);
        }

        pre {
            margin: 0;
            padding: 14px;
            color: #111827;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            direction: ltr;
            text-align: left;
            background: #fbfdff;
        }

        .drawer {
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform-origin: top right;
        }

        .drawer.hidden-panel {
            transform: translateY(-8px) scale(0.96);
            opacity: 0;
            pointer-events: none;
        }

        .chat-item {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .chat-item:hover,
        .chat-item.active {
            border-color: #818cf8;
            background: #eef2ff;
        }

        .chat-item.loading {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .chat-actions-btn {
            border: none;
            background: transparent;
            color: #64748b;
            width: 28px;
            height: 28px;
            border-radius: 999px;
        }

        .chat-actions-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .chat-item-menu {
            position: absolute;
            top: 38px;
            left: 10px;
            z-index: 30;
            border: 1px solid #dbeafe;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
            min-width: 152px;
            overflow: hidden;
        }

        .chat-item-menu button {
            width: 100%;
            text-align: right;
            padding: 10px 12px;
            font-size: 12px;
            border: none;
            background: #fff;
            color: #334155;
        }

        .chat-item-menu button:hover {
            background: #f8fafc;
        }

        .chat-item-menu .danger {
            color: #b91c1c;
            background: #fef2f2;
        }

        .upload-badge {
            border: 1px solid #dbeafe;
            background: #eff6ff;
            color: #1e3a8a;
            border-radius: 999px;
            font-size: 11px;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 4px 4px 0 0;
        }

        .html-banner {
            margin-top: auto;
            border: 1px dashed #a5b4fc;
            border-radius: 14px;
            background: linear-gradient(120deg, #eef2ff, #f8fafc);
            padding: 10px;
        }

        .status-pill {
            font-size: 10px;
            border-radius: 999px;
            padding: 2px 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-inline-start: 6px;
        }

        .status-pill.waiting {
            background: #fef3c7;
            color: #92400e;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .ghost-btn {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            border-radius: 999px;
            padding: 9px 14px;
            font-size: 13px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .ghost-btn:hover {
            transform: translateY(-1px);
            border-color: #c7d2fe;
            color: #312e81;
            background: #eef2ff;
        }

        .typing-min {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }

        .typing-min span {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #f59e0b;
            animation: pulseDots 1.2s infinite;
        }

        .typing-min span:nth-child(2) { animation-delay: 0.2s; }
        .typing-min span:nth-child(3) { animation-delay: 0.4s; }

        .mic-btn {
            border: 1px solid #dbeafe;
            background: linear-gradient(145deg, #ffffff, #eef2ff);
            color: #4338ca;
            position: relative;
        }

        .mic-btn:hover {
            background: linear-gradient(145deg, #eef2ff, #e0e7ff);
            border-color: #c7d2fe;
        }

        .mic-btn.recording {
            color: #ffffff;
            border-color: #ef4444;
            background: linear-gradient(145deg, #ef4444, #dc2626);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
            animation: micPulse 1.2s ease-in-out infinite;
        }

        .mic-btn.recording::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 999px;
            border: 2px solid rgba(239, 68, 68, 0.35);
        }

        .mic-status {
            min-height: 18px;
        }

        @keyframes micPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }
        }

        .public-link-box {
            margin: 10px 12px 12px;
            padding: 10px;
            border: 1px solid #dbeafe;
            background: #f8fbff;
            border-radius: 12px;
        }

        .public-link-status {
            font-size: 12px;
            margin-bottom: 8px;
            color: #334155;
        }

        .public-link-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .public-link-input {
            flex: 1;
            min-width: 180px;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 12px;
            background: #fff;
            color: #0f172a;
        }

        .qr-banner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 16px;
        }

        .qr-banner-overlay.show {
            display: flex;
        }

        .qr-banner-card {
            width: min(92vw, 360px);
            background: #fff;
            border-radius: 18px;
            border: 1px solid #dbeafe;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
            padding: 16px;
            text-align: center;
        }

        .qr-banner-image {
            width: 220px;
            height: 220px;
            margin: 10px auto;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            object-fit: cover;
            background: #f8fafc;
        }

        @keyframes pulseDots {
            0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        @media (max-width: 1024px) {
            .app-shell {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .history-panel {
                width: 100%;
                max-width: none;
                min-width: 0;
                max-height: 240px;
            }

            .chat-container {
                height: calc(100vh - 390px);
                min-height: 340px;
            }
        }
    </style>
</head>
<body>
    <div id="auth-banner" class="max-w-5xl mx-auto mt-8 p-6 bg-white/95 border border-slate-200 rounded-3xl shadow-lg">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h2 class="text-2xl font-semibold text-slate-900">התחברות לחשבון</h2>
                <p class="text-slate-600 mt-1">כדי לשמור את כל השיחות שלך ב-Firebase Firestore, אפשר להתחבר עם Google או עם מייל וסיסמה.</p>
            </div>
            <div class="w-full sm:w-auto sm:min-w-[360px] flex flex-col gap-3">
                <input id="email-input" type="email" autocomplete="email" placeholder="האימייל שלך" class="bg-white border border-slate-300 focus:border-indigo-500 rounded-xl px-4 py-3 outline-none text-sm text-slate-900">
                <input id="password-input" type="password" autocomplete="current-password" placeholder="סיסמה (לפחות 6 תווים)" class="bg-white border border-slate-300 focus:border-indigo-500 rounded-xl px-4 py-3 outline-none text-sm text-slate-900">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <button id="email-login-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white rounded-full px-4 py-3 text-sm font-medium">
                        התחברות עם מייל
                    </button>
                    <button id="email-signup-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white rounded-full px-4 py-3 text-sm font-medium">
                        הרשמה עם מייל
                    </button>
                </div>
                <button id="google-login-btn" class="bg-white border border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 text-slate-800 rounded-full px-5 py-3 inline-flex items-center justify-center gap-2">
                    <i class="fa-brands fa-google text-red-500"></i>
                    התחבר עם Google
                </button>
                <p id="auth-status" class="text-xs text-slate-500 min-h-[1.25rem]"></p>
            </div>
        </div>
    </div>

    <div id="app-shell" class="app-shell hidden">
        <aside class="history-panel p-4">
            <button onclick="createNewChat()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 px-4 flex items-center justify-center gap-2 shadow-md shadow-indigo-200">
                <i class="fa-solid fa-plus"></i>
                <span>צ'אט חדש</span>
            </button>
            <div class="mt-4 flex items-center justify-between">
                <h2 class="font-semibold text-slate-800">השיחות שלך</h2>
                <span id="chats-count" class="text-xs bg-indigo-100 text-indigo-700 rounded-full px-2 py-1">0</span>
            </div>
            <div id="chat-list" class="mt-3 space-y-2 overflow-y-auto pr-1"></div>
            <div class="html-banner">
                <button onclick="openHtmlFilesPanel()" class="w-full text-right text-sm text-indigo-700 font-medium">
                    <i class="fa-solid fa-folder-open ml-1"></i>
                    קבצי HTML שלך
                </button>
                <p class="text-xs text-slate-500 mt-1">לחיצה תפתח תיקייה וירטואלית עם קבצי HTML מהשיחות.</p>
            </div>
        </aside>

        <div class="chat-workspace">
            <header class="bg-white/90 backdrop-blur border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="brand-logo">י</div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-semibold text-slate-900">בונה אתרים עם יזם אתרים</h1>
                        <p class="text-slate-500 text-sm">שיחות ממשיכות לרוץ ברקע גם כשעוברים לצ׳אט אחר</p>
                    </div>
                </div>
                <div class="relative header-actions">
                    <div id="user-chip" class="hidden items-center gap-2 text-xs bg-slate-100 border border-slate-200 rounded-full px-3 py-2">
                        <i class="fa-regular fa-user"></i>
                        <span id="user-email"></span>
                    </div>
                    <button id="logout-btn" class="ghost-btn hidden">
                        <i class="fa-solid fa-right-from-bracket ml-1"></i> התנתק
                    </button>
                    <button onclick="duplicateCurrentChat()" class="ghost-btn">
                        <i class="fa-regular fa-clone ml-1"></i> שכפל שיחה
                    </button>
                    <button onclick="toggleMenu()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-full text-sm text-slate-700">
                        <i class="fa-solid fa-bars"></i>
                        <span>תפריט</span>
                    </button>
                    <section id="top-menu" class="drawer hidden-panel absolute left-0 top-14 w-72 bg-white border border-slate-200 rounded-2xl p-4 shadow-lg z-20">
                        <h2 class="font-semibold text-slate-900 mb-3">אפשרויות</h2>
                        <div class="space-y-2 text-sm">
                            <button onclick="openSettings()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-gear ml-2 text-indigo-500"></i> הגדרות
                            </button>
                            <button onclick="openContact()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-envelope ml-2 text-indigo-500"></i> יצירת קשר (מייל)
                            </button>
                            <button onclick="openPremium()" class="w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl p-3">
                                <i class="fa-solid fa-crown ml-2 text-amber-500"></i> מנוי פרימיום (בקרוב)
                            </button>
                            <button onclick="clearChat()" class="w-full text-right bg-red-50 hover:bg-red-100 border border-red-100 text-red-700 rounded-xl p-3">
                                <i class="fa-solid fa-trash ml-2"></i> נקה שיחה נוכחית
                            </button>
                        </div>
                    </section>
                </div>
            </header>

            <main id="chat-messages" class="chat-container p-4 sm:p-6 overflow-y-auto flex flex-col gap-5 mt-3 bg-white border border-slate-200 rounded-2xl shadow-sm"></main>

            <div class="my-3 p-3 sm:p-4 border border-slate-200 bg-white rounded-2xl shadow-sm">
                <form id="chat-form" class="flex gap-3 items-center">
                    <input id="file-input" type="file" accept="image/*,.html,text/html" multiple class="hidden">
                    <button type="button" onclick="triggerFileUpload()" class="ghost-btn !px-4 !py-3" title="העלאת קובץ">
                        <i class="fa-solid fa-paperclip ml-1"></i> קובץ
                    </button>
                    <input id="user-input"
                           type="text"
                           class="flex-1 bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-full px-6 py-4 outline-none text-base text-slate-900"
                           placeholder="תאר את האתר שתרצה לבנות או לשפר...">
                    <button id="mic-btn" type="button" class="mic-btn w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-indigo-100" title="הקלטה קולית">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                    <button type="button" onclick="shareChat()" class="bg-emerald-500 hover:bg-emerald-600 w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-emerald-200" title="שתף צ'אט">
                        <i class="fa-solid fa-share-nodes text-white text-xl"></i>
                    </button>
                    <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 w-14 h-14 rounded-full flex items-center justify-center transition-colors shadow-md shadow-indigo-200">
                        <i class="fa-solid fa-paper-plane text-white text-xl"></i>
                    </button>
                </form>
                <p id="mic-status" class="mic-status mt-2 text-xs text-slate-500"></p>
                <div id="upload-preview" class="mt-2"></div>
            </div>
        </div>
    </div>

    <div id="html-files-modal" class="hidden fixed inset-0 bg-slate-900/40 z-40 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-2xl border border-slate-200">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-semibold text-slate-900">תיקיית קבצי HTML</h3>
                <button onclick="closeHtmlFilesPanel()" class="ghost-btn">סגור</button>
            </div>
            <div id="html-files-list" class="mt-3 max-h-[60vh] overflow-auto space-y-2"></div>
        </div>
    </div>
    <div id="qr-banner" class="qr-banner-overlay" onclick="closeQrBanner(event)">
        <div class="qr-banner-card">
            <div class="flex items-center justify-between gap-2">
                <h3 class="text-base font-semibold text-slate-900">קוד QR לקישור הציבורי</h3>
                <button onclick="closeQrBanner(event)" class="ghost-btn !py-1 !px-3 text-xs">סגור</button>
            </div>
            <img id="qr-banner-image" class="qr-banner-image" alt="QR Code">
            <p id="qr-banner-link" class="text-xs text-slate-500 break-all"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,

            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut

        import {
            getFirestore,
            collection,
            doc,
            deleteDoc,
            onSnapshot,
            orderBy,
            query,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmkioVK9XKo2LJhN8EysPULxIpX81URR4",
            authDomain: "aiai-f4c2a.firebaseapp.com",
            projectId: "aiai-f4c2a",
            storageBucket: "aiai-f4c2a.firebasestorage.app",
            messagingSenderId: "815268198210",
            appId: "1:815268198210:web:214f510503e602327afadb",
            measurementId: "G-XPE90F1LS9"
        };

        const app = initializeApp(firebaseConfig);
        getAnalytics(app);
        const auth = getAuth(app);

        const qrBannerLink = document.getElementById('qr-banner-link');
        const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;
        let speechFinalText = '';
        let speechInterimText = '';
        const LOCAL_CHAT_CACHE_PREFIX = 'chat-cache-v1';

        function getLocalChatCacheKey(user = currentUser) {
            if (!user?.uid) return null;
            return `${LOCAL_CHAT_CACHE_PREFIX}:${user.uid}`;
        }

        function saveChatsToLocalCache(nextChats) {
            const cacheKey = getLocalChatCacheKey();
            if (!cacheKey) return;
            try {
                localStorage.setItem(cacheKey, JSON.stringify(nextChats));
            } catch (error) {
                console.warn('Local chat cache save failed:', error);
            }
        }

        function loadChatsFromLocalCache(user = currentUser) {
            const cacheKey = getLocalChatCacheKey(user);
            if (!cacheKey) return [];
            try {
                const parsed = JSON.parse(localStorage.getItem(cacheKey) || '[]');
                if (!Array.isArray(parsed)) return [];
                return parsed.map((chat) => ({
                    ...chat,
                    messages: Array.isArray(chat?.messages) ? chat.messages : []
                }));
            } catch (error) {
                console.warn('Local chat cache read failed:', error);
                return [];
            }
        }

        function updateSpeechInput() {
            const mergedText = [speechFinalText, speechInterimText].filter(Boolean).join(' ').trim();
            if (mergedText) {
                input.value = mergedText;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }

        function setMicState(recording) {
            isRecording = recording;
            micButton?.classList.toggle('recording', recording);
            micButton?.setAttribute('aria-pressed', recording ? 'true' : 'false');
            if (recording) {
                micButton.title = 'עצור הקלטה';
                micStatus.textContent = 'מקליט... אפשר לדבר בעברית.';
            } else {
                micButton.title = 'הקלטה קולית';
                if (!micStatus.textContent.includes('לא נתמך')) {
                    micStatus.textContent = speechFinalText ? 'ההקלטה הסתיימה. אפשר לערוך או לשלוח.' : '';
                }
            }
        }

        function stopSpeechRecognition() {
            if (!recognition || !isRecording) return;
            recognition.stop();
        }

        function startSpeechRecognition() {
            if (!SpeechRecognitionClass) {
                micStatus.textContent = 'הדפדפן לא תומך בהקלדה קולית. מומלץ להשתמש ב-Chrome מעודכן.';
                return;
            }

            speechFinalText = input.value.trim();
            speechInterimText = '';

            if (!recognition) {
                recognition = new SpeechRecognitionClass();
                recognition.lang = 'he-IL';
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    let finalChunk = '';
                    let interimChunk = '';
                    for (let i = event.resultIndex; i < event.results.length; i += 1) {
                        const transcript = event.results[i][0]?.transcript?.trim() || '';
                        if (!transcript) continue;
                        if (event.results[i].isFinal) {
                            finalChunk += `${transcript} `;
                        } else {
                            interimChunk += `${transcript} `;
                        }
                    }
                    if (finalChunk) {
                        speechFinalText = [speechFinalText, finalChunk.trim()].filter(Boolean).join(' ').trim();
                    }
                    speechInterimText = interimChunk.trim();
                    updateSpeechInput();
                };

                recognition.onerror = (event) => {
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        micStatus.textContent = 'אין הרשאת מיקרופון. אשר/י הרשאה כדי להשתמש בהקלטה קולית.';
                    } else if (event.error === 'no-speech') {
                        micStatus.textContent = 'לא זוהה דיבור. נסה/י שוב.';
                    } else if (event.error !== 'aborted') {
                        micStatus.textContent = `שגיאת זיהוי קול: ${event.error}`;
                    }
                };

                recognition.onend = () => {
                    speechInterimText = '';
                    updateSpeechInput();
                    setMicState(false);
                };
            }

            try {
                recognition.start();
                setMicState(true);
            } catch (error) {
                if (!isRecording) {
                    micStatus.textContent = 'לא ניתן להתחיל הקלטה כרגע. נסה/י שוב.';
                }
            }
        }

        if (!SpeechRecognitionClass) {
            micButton.disabled = true;
            micButton.classList.add('opacity-60', 'cursor-not-allowed');
            micStatus.textContent = 'הקלדה קולית אינה נתמכת בדפדפן הזה.';
        }

        function toggleMenu() {
            topMenu.classList.toggle('hidden-panel');
        }

        function getCurrentChat() {
            return chats.find(chat => chat.id === activeChatId);
        }

        async function saveChatDoc(chat) {
            if (!currentUser) return;
            const safeMessages = Array.isArray(chat.messages) ? chat.messages : [];
            await setDoc(doc(db, 'users', currentUser.uid, 'chats', chat.id), {
                title: chat.title || 'שיחה חדשה',
                updatedAt: Date.now(),
                createdAt: chat.createdAt || Date.now(),
                messages: safeMessages
            }, { merge: true });
            saveChatsToLocalCache(chats);
        }

        function subscribeToChats() {
            if (!currentUser) return;
            if (unsubscribeChats) unsubscribeChats();

            const cachedChats = loadChatsFromLocalCache(currentUser);
            if (cachedChats.length) {
                chats = cachedChats;
                if (!activeChatId || !chats.some(chat => chat.id === activeChatId)) {
                    activeChatId = chats[0].id;
                }
                renderChatList();
                renderMessages();
            }

            const chatsQuery = query(
                collection(db, 'users', currentUser.uid, 'chats'),
                orderBy('updatedAt', 'desc')
            );

            unsubscribeChats = onSnapshot(chatsQuery, async (snapshot) => {
                chats = snapshot.docs.map((item) => {
                    const data = item.data();
                    return {
                        id: item.id,
                        title: data.title || 'שיחה חדשה',
                        updatedAt: Number(data.updatedAt) || Date.now(),
                        createdAt: Number(data.createdAt) || Date.now(),
                        messages: Array.isArray(data.messages) ? data.messages : []
                    };
                });
                saveChatsToLocalCache(chats);

                if (!chats.length) {
                    await createNewChat();
                    return;
                }

                if (!activeChatId || !chats.some(chat => chat.id === activeChatId)) {
                    activeChatId = chats[0].id;
                }

                renderChatList();
                renderMessages();
            }, (error) => {
                console.error('Firestore listener error:', error);
                if (!chats.length) {
                    const fallbackChats = loadChatsFromLocalCache(currentUser);
                    if (fallbackChats.length) {
                        chats = fallbackChats;
                        if (!activeChatId || !chats.some(chat => chat.id === activeChatId)) {
                            activeChatId = chats[0].id;
                        }
                        renderChatList();
                        renderMessages();
                    }
                }
                alert('שגיאה בטעינת השיחות מ-Firebase. נטענו נתונים מהמטמון המקומי אם היו זמינים.');
            });
        }

        function renderChatList() {
            chats.sort((a, b) => b.updatedAt - a.updatedAt);
            chatsCount.textContent = chats.length;

            chatList.innerHTML = chats.map(chat => {
                const isActive = chat.id === activeChatId;
                const subtitle = chat.messages[0]?.content?.slice(0, 26) || 'אין הודעות עדיין';
                const pendingRequests = pendingByChat.get(chat.id) || 0;

                const menu = openMenuChatId === chat.id ? `<div class="chat-item-menu" onclick="event.stopPropagation()">
                    <button onclick="shareSpecificChat('${chat.id}')"><i class="fa-solid fa-share-nodes ml-1"></i> שתף במייל (Gmail)</button>
                    <button class="danger" onclick="deleteChatById('${chat.id}')"><i class="fa-solid fa-trash ml-1"></i> מחק שיחה</button>
                </div>` : '';
                return `<div class="chat-item ${isActive ? 'active' : ''} ${pendingRequests ? 'loading' : ''}" onclick="switchChat('${chat.id}')">
                    <div class="flex items-start justify-between gap-2">
                        <div class="font-medium text-sm text-slate-800">
                            ${escapeHtml(chat.title)}
                            ${pendingRequests ? '<span class="status-pill waiting"><i class="fa-solid fa-rotate fa-spin"></i> יזם חושב</span>' : ''}
                        </div>
                        <button class="chat-actions-btn" onclick="toggleChatMenu(event, '${chat.id}')"><i class="fa-solid fa-ellipsis"></i></button>
                    </div>
                    <div class="text-xs text-slate-500 mt-1">${escapeHtml(subtitle)}</div>
                    ${pendingRequests ? '<div class="typing-min"><span></span><span></span><span></span></div>' : ''}
                    ${menu}
                </div>`;
            }).join('');
        }

        function switchChat(chatId) {
            activeChatId = chatId;
            openMenuChatId = null;
            renderChatList();
            renderMessages();
        }

        function toggleChatMenu(event, chatId) {

        async function deleteChatById(chatId) {
            if (!currentUser) return;
            if (!confirm('למחוק את השיחה הזו?')) return;
            await deleteDoc(doc(db, 'users', currentUser.uid, 'chats', chatId));

            if (activeChatId === chatId) {

        async function createNewChat() {
            if (!currentUser) return;
            const chat = {
                id: crypto.randomUUID(),
                title: `שיחה חדשה ${chats.length + 1}`,

                createdAt: Date.now(),

        async function addMessage(role, content, chatId = activeChatId) {
            const currentChat = chats.find(chat => chat.id === chatId);
            if (!currentChat) return;
            currentChat.messages.push({ role, content });
            if (currentChat.messages.length === 1 && role === 'user') {
                currentChat.title = content.slice(0, 34);
            }
            currentChat.updatedAt = Date.now();
            await saveChatDoc(currentChat);

            if (chatId === activeChatId) {
                renderMessages();
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function renderMessages() {
            const currentChat = getCurrentChat();
            if (!currentChat?.messages.length) {
                renderWelcome();
                return;
            }

            chatMessages.innerHTML = '';
            currentChat.messages.forEach(({ role, content }) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

                if (role === 'user') {
                    messageDiv.innerHTML = `<div class="message-bubble user-bubble">${escapeHtml(content)}</div>`;
                } else {
                    messageDiv.innerHTML = `
                        <div class="flex gap-3 items-start max-w-full w-full">
                            <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-blue-500 rounded-2xl flex-shrink-0 flex items-center justify-center text-white text-sm mt-1">י</div>
                            <div class="assistant-bubble message-bubble max-w-none">
                                ${formatMessage(content)}
                            </div>
                        </div>
                    `;
                }
                chatMessages.appendChild(messageDiv);
            });
        }

        function formatMessage(content) {
            const regex = /```(?:html)?\n([\s\S]*?)```/g;
            const parts = [];
            let lastIndex = 0;
            let match;

            while ((match = regex.exec(content)) !== null) {
                const textPart = content.slice(lastIndex, match.index);
                if (textPart) {
                    parts.push(escapeHtml(textPart).replace(/\n/g, '<br>'));
                }

                const htmlCode = match[1].trim();
                const escapedCode = escapeHtml(htmlCode);
                const codeId = `html-${simpleHash(htmlCode)}`;
                const existingUrl = htmlPublicLinks.get(codeId) || '';
                parts.push(`<div class="code-card">
                    <div class="code-header">
                        <span>קובץ HTML מוכן לשימוש</span>
                        <div class="code-actions">
                            <button onclick="copyCode(this)" class="action-btn">
                                <i class="fa-solid fa-copy"></i> העתק
                            </button>
                            <button onclick="downloadCode(this)" class="action-btn">
                                <i class="fa-solid fa-download"></i> הורד
                            </button>
                            <button onclick="createPublicHtmlLink(this)" class="action-btn">
                                <i class="fa-solid fa-link"></i> צור קישור ציבורי
                            </button>
                        </div>
                    </div>
                    <div class="public-link-box">
                        <div class="public-link-status">${existingUrl ? 'הקישור הציבורי נוצר בהצלחה.' : 'עדיין לא נוצר קישור ציבורי.'}</div>
                        <div class="public-link-row">
                            <input class="public-link-input" type="text" readonly value="${escapeHtml(existingUrl)}" placeholder="כאן יופיע הקישור הציבורי מ-Firebase Storage">
                            <button onclick="copyPublicLink(this)" class="action-btn copy-link-btn" ${existingUrl ? '' : 'disabled'}>
                                <i class="fa-solid fa-copy"></i> העתק קישור
                            </button>
                            <button onclick="showQrForLink(this)" class="action-btn qr-link-btn" ${existingUrl ? '' : 'disabled'}>
                                <i class="fa-solid fa-qrcode"></i> קוד QR
                            </button>
                        </div>
                    </div>
                    <pre><code data-code-id="${codeId}">${escapedCode}</code></pre>
                </div>`);

                lastIndex = regex.lastIndex;
            }

            const tail = content.slice(lastIndex);
            if (tail) {
                parts.push(escapeHtml(tail).replace(/\n/g, '<br>'));
            }

            return parts.join('');
        }

        function escapeHtml(unsafe) {
            return String(unsafe ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function simpleHash(text) {
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36);
        }

        function setChatPending(chatId, isPending) {
            const current = pendingByChat.get(chatId) || 0;
            const nextValue = Math.max(0, current + (isPending ? 1 : -1));
            if (nextValue === 0) {
                pendingByChat.delete(chatId);
            } else {
                pendingByChat.set(chatId, nextValue);
            }
            renderChatList();
        }

        async function uploadFileToStorage(file) {
            if (!currentUser) return null;
            const safeName = file.name.replace(/[^\w.\-]+/g, '_');
            const storageRef = ref(storage, `uploads/${currentUser.uid}/${Date.now()}-${safeName}`);
            const result = await uploadBytes(storageRef, file);
            return getDownloadURL(result.ref);
        }

        async function readImageDetails(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => resolve({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        width: img.width,
                        height: img.height,
                        previewUrl: reader.result
                    });
                    img.onerror = () => resolve({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        width: null,
                        height: null,
                        previewUrl: reader.result
                    });
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function readHtmlContent(file) {
            const text = await file.text();
            return text.slice(0, 3000);
        }

        async function processPendingUploads() {
            if (!pendingUploads.length) return '';
            const segments = [];
            for (const file of pendingUploads) {
                try {
                    const url = await uploadFileToStorage(file);
                    if (file.type.startsWith('image/')) {
                        const details = await readImageDetails(file);
                        segments.push(
                            `קובץ תמונה הועלה: ${details.name} (${details.width || '?'}x${details.height || '?'}, ${Math.round(details.size / 1024)}KB). URL: ${url}.`
                        );
                    } else if (file.name.toLowerCase().endsWith('.html') || file.type.includes('html')) {
                        const htmlSnippet = await readHtmlContent(file);
                        segments.push(
                            `קובץ HTML הועלה: ${file.name}. URL: ${url}. תוכן מקוצר:\n\`\`\`html\n${htmlSnippet}\n\`\`\`\nנתח את המבנה והבן מה המשתמש רוצה לשנות.`
                        );
                    } else {
                        segments.push(`קובץ הועלה: ${file.name}. URL: ${url}.`);
                    }
                } catch (error) {
                    console.error('Upload failed:', error);
                    segments.push(`העלאה נכשלה עבור ${file.name}.`);
                }
            }
            return segments.join('\n');
        }

        function triggerFileUpload() {
            fileInput.click();
        }

        function renderUploadPreview() {
            uploadPreview.innerHTML = pendingUploads.map(file => `
                <span class="upload-badge">
                    <i class="fa-solid ${file.type.startsWith('image/') ? 'fa-image' : 'fa-file-code'}"></i>
                    ${escapeHtml(file.name)}
                </span>
            `).join('');
        }

        async function sendMessage() {
            const userText = input.value.trim();
            if ((!userText && !pendingUploads.length) || !currentUser) return;

            const uploadedContext = await processPendingUploads();
            const finalText = [userText, uploadedContext].filter(Boolean).join('\n\n');

            const chatId = activeChatId;
            await addMessage('user', finalText, chatId);
            input.value = '';
            pendingUploads = [];
            renderUploadPreview();

            const requestId = `typing-${++requestCounter}`;
            const typingDiv = document.createElement('div');
            typingDiv.id = requestId;
            typingDiv.className = 'flex justify-start';
            typingDiv.innerHTML = `
                <div class="flex gap-3 items-start">
                    <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-blue-500 rounded-2xl flex items-center justify-center text-white text-sm mt-1">י</div>
                    <div class="bg-slate-100 border border-slate-200 rounded-2xl px-5 py-3 flex items-center gap-2">
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                        </div>
                        <span class="text-slate-500 text-sm">יזם חושב...</span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            setChatPending(chatId, true);

            try {
                const sourceChat = chats.find(chat => chat.id === chatId);
                const fullConversation = Array.isArray(sourceChat?.messages) ? sourceChat.messages : [];
                const messagesForAI = fullConversation.slice(-6);
                const res = await fetch('https://noisy-dust-c360.zm0548407450.workers.dev/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messagesForAI })
                });

                const data = await res.json();
                document.getElementById(requestId)?.remove();

                if (data.content) {
                    await addMessage('assistant', data.content, chatId);
                } else {
                    await addMessage('assistant', 'שגיאה – בדוק שהשרת רץ.', chatId);
                }
            } catch (err) {
                console.error(err);
                document.getElementById(requestId)?.remove();
                await addMessage('assistant', 'שגיאה בחיבור לשרת. ודא שהשרת זמין.', chatId);
            } finally {
                setChatPending(chatId, false);
                if (chatId === activeChatId) {
                    renderMessages();
                }
            }
        }

        async function clearChat() {
            const currentChat = getCurrentChat();
            if (!currentChat) return;
            if (confirm('לנקות את השיחה הנוכחית?')) {
                currentChat.messages = [];
                currentChat.title = 'שיחה חדשה';
                currentChat.updatedAt = Date.now();
                await saveChatDoc(currentChat);
                renderWelcome();
            }
        }

        function renderWelcome() {

                <div class="text-center text-slate-600 py-12">
                    <div class="mx-auto w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-3xl mb-4">✨</div>
                    <h2 class="text-2xl font-semibold text-slate-900">ברוך הבא! כל הנתונים נשמרים בענן</h2>
                    <p class="mt-2 max-w-2xl mx-auto">השיחות שלך נשמרות ב-Firebase Firestore תחת החשבון האישי שלך. אפשר להתחבר מכל מכשיר ולראות את ההיסטוריה.</p>
                </div>
            `;
        }

        function openSettings() {
            alert('הגדרות יתווספו כאן בקרוב (תמיכה בעיצוב, מודל, ושפה).');
        }

        function openContact() {
            const subject = encodeURIComponent('יצירת קשר מבונה אתרים עם יזם אתרים');
            const body = encodeURIComponent('היי, אשמח לעזרה בנושא:');
            window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=support@gmail.com&su=${subject}&body=${body}`, '_blank');
        }

        function openPremium() {
            alert('מנוי פרימיום יושק בהמשך: שמירת ענן, תבניות מתקדמות וחיבורים נוספים.');
        }

        async function duplicateCurrentChat() {
            const currentChat = getCurrentChat();
            if (!currentChat || !currentUser) return;
            const clone = {
                ...currentChat,
                id: crypto.randomUUID(),
                title: `${currentChat.title} (עותק)`,
                messages: [...currentChat.messages],
                updatedAt: Date.now(),
                createdAt: Date.now()
            };
            activeChatId = clone.id;
            await saveChatDoc(clone);
        }

        function exportChatHtml() {
            const currentChat = getCurrentChat();
            if (!currentChat) return '';
            const rows = currentChat.messages.map(msg => `
                <article style="margin:12px 0;padding:14px;border-radius:12px;border:1px solid #e2e8f0;background:${msg.role === 'user' ? '#dbeafe' : '#fff'}">
                    <h4 style="margin:0 0 8px 0;font-family:Arial">${msg.role === 'user' ? 'משתמש' : 'עוזר'}</h4>
                    <div style="white-space:pre-wrap;font-family:Arial">${escapeHtml(msg.content)}</div>
                </article>
            `).join('');

            return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>${escapeHtml(currentChat.title)}</title></head><body style="font-family:Arial;background:#f8fafc;padding:20px"><h2>ייצוא צ'אט: ${escapeHtml(currentChat.title)}</h2>${rows}</body></html>`;
        }

        async function shareChat(preferredChannel = null) {
            const currentChat = getCurrentChat();
            if (!currentChat || !currentChat.messages.length) {
                alert('אין תוכן לשיתוף כרגע.');
                return;
            }

            const htmlContent = exportChatHtml();
            const file = new File([htmlContent], `chat-export-${Date.now()}.html`, { type: 'text/html' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: 'שיתוף צ׳אט',
                    text: 'מצורף קובץ HTML של הצ׳אט.',
                    files: [file]
                });
                return;
            }

            const url = URL.createObjectURL(file);
            if (preferredChannel === 'whatsapp') {
                window.open(`https://wa.me/?text=${encodeURIComponent('מצורף סיכום צ׳אט. הורד/י את הקובץ מהדפדפן: ' + url)}`, '_blank');
            } else {
                const subject = encodeURIComponent('ייצוא צ׳אט HTML');
                const body = encodeURIComponent('היי, מצורף לינק לקובץ הצ׳אט (זמני): ' + url);
                window.open(`https://mail.google.com/mail/?view=cm&fs=1&tf=1&su=${subject}&body=${body}`, '_blank');
            }

            const dl = document.createElement('a');
            dl.href = url;
            dl.download = file.name;
            dl.click();
        }

        function collectHtmlExports() {
            const exports = [];
            chats.forEach(chat => {
                (chat.messages || []).forEach((msg, index) => {
                    if (msg.role !== 'assistant') return;
                    const matches = msg.content.match(/```(?:html)?\n([\s\S]*?)```/g) || [];
                    matches.forEach((block, blockIndex) => {
                        const clean = block.replace(/```(?:html)?\n?/g, '').replace(/```$/, '').trim();
                        exports.push({
                            name: `${chat.title || 'chat'}-${index + 1}-${blockIndex + 1}.html`,
                            content: clean
                        });
                    });
                });
            });
            return exports;
        }

        function openHtmlFilesPanel() {
            const files = collectHtmlExports();
            if (!files.length) {
                htmlFilesList.innerHTML = '<p class="text-sm text-slate-500">עדיין אין קבצי HTML בשיחות.</p>';
            } else {
                htmlFilesList.innerHTML = files.map((file, i) => `
                    ${(() => {
                        const panelKey = `panel-${simpleHash(file.content)}`;
                        const existingUrl = htmlPublicLinks.get(panelKey) || '';
                        return `
                    <div class="border border-slate-200 rounded-xl p-3 space-y-2">
                        <div class="text-sm text-slate-700 truncate">${escapeHtml(file.name)}</div>
                        <div class="public-link-row">
                            <button class="action-btn" onclick="downloadHtmlFromPanel(${i})"><i class="fa-solid fa-download"></i> הורד</button>
                            <button class="action-btn" onclick="createPublicLinkFromPanel(${i}, this)"><i class="fa-solid fa-link"></i> צור קישור ציבורי</button>
                        </div>
                        <div class="public-link-row">
                            <input id="panel-public-link-${i}" class="public-link-input" type="text" readonly value="${escapeHtml(existingUrl)}" placeholder="כאן יופיע קישור ציבורי לקובץ HTML מהתיקייה">
                            <button class="action-btn" onclick="copyPublicLinkFromPanel(${i}, this)" ${existingUrl ? '' : 'disabled'}>
                                <i class="fa-solid fa-copy"></i> העתק קישור
                            </button>
                            <button class="action-btn" onclick="showQrFromPanel(${i})" ${existingUrl ? '' : 'disabled'}>
                                <i class="fa-solid fa-qrcode"></i> קוד QR
                            </button>
                        </div>
                        <p id="panel-public-status-${i}" class="text-xs text-slate-500">${existingUrl ? 'הקישור הציבורי זמין.' : 'עדיין לא נוצר קישור ציבורי.'}</p>
                    </div>
                        `;
                    })()}
                `).join('');
            }
            window.__htmlExports = files;
            htmlFilesModal.classList.remove('hidden');
            htmlFilesModal.classList.add('flex');
        }

        function closeHtmlFilesPanel() {
            htmlFilesModal.classList.add('hidden');
            htmlFilesModal.classList.remove('flex');
        }

        function downloadHtmlFromPanel(index) {
            const file = (window.__htmlExports || [])[index];
            if (!file) return;
            const blob = new Blob([file.content], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = file.name;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function shareSpecificChat(chatId) {
            const originalActive = activeChatId;
            activeChatId = chatId;
            await shareChat('gmail');
            activeChatId = originalActive;
            openMenuChatId = null;
            renderChatList();
        }

        window.copyCode = function(button) {
            const text = button.closest('.code-card').querySelector('pre code').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const original = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check"></i> הועתק';
                setTimeout(() => button.innerHTML = original, 1600);
            });
        };

        window.downloadCode = function(button) {
            const text = button.closest('.code-card').querySelector('pre code').textContent;
            const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `יזם-אתרים-${Date.now()}.html`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);

            const original = button.innerHTML;
            button.innerHTML = '<i class="fa-solid fa-circle-check"></i> ירד בהצלחה';
            setTimeout(() => button.innerHTML = original, 1600);
        };

        async function uploadHtmlToFirebaseStorage(htmlContent, uid) {
            const timestamp = Date.now();
            const fileName = `site-${timestamp}.html`;
            const filePath = `public-pages/${uid}/${fileName}`;
            const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
            const storageRef = ref(storage, filePath);
            const uploadResult = await uploadBytes(storageRef, htmlBlob, { contentType: 'text/html' });
            return getDownloadURL(uploadResult.ref);
        }

        window.createPublicHtmlLink = async function(button) {
            const codeElement = button.closest('.code-card')?.querySelector('pre code');
            const status = button.closest('.code-card')?.querySelector('.public-link-status');
            const linkInput = button.closest('.code-card')?.querySelector('.public-link-input');
            const copyLinkBtn = button.closest('.code-card')?.querySelector('.copy-link-btn');
            const qrLinkBtn = button.closest('.code-card')?.querySelector('.qr-link-btn');
            const htmlContent = codeElement?.textContent || '';

            if (!currentUser) {
                if (status) status.textContent = 'אין משתמש מחובר. יש להתחבר כדי ליצור קישור ציבורי.';
                alert('אין משתמש מחובר. התחבר/י כדי להעלות HTML ל-Firebase Storage.');
                return;
            }

            if (!htmlContent.trim()) {
                if (status) status.textContent = 'לא נמצא תוכן HTML להעלאה.';
                return;
            }

            const original = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מעלה...';
            if (status) status.textContent = 'מעלה את קובץ ה-HTML ל-Firebase Storage...';

            try {
                const publicUrl = await uploadHtmlToFirebaseStorage(htmlContent, currentUser.uid);
                const codeId = codeElement.dataset.codeId || `html-${simpleHash(htmlContent)}`;
                htmlPublicLinks.set(codeId, publicUrl);
                if (linkInput) linkInput.value = publicUrl;
                if (status) status.textContent = 'הצלחה! התקבל קישור ציבורי תקין.';
                if (copyLinkBtn) copyLinkBtn.disabled = false;
                if (qrLinkBtn) qrLinkBtn.disabled = false;
                alert('הקישור הציבורי נוצר בהצלחה ונשמר ב-Firebase Storage.');
            } catch (error) {
                console.error('Public HTML upload failed:', error);
                const details = error?.message ? `פרטים: ${error.message}` : 'לא התקבלו פרטים נוספים מהמערכת.';
                if (status) status.textContent = `שגיאה בהעלאה ל-Storage. ${details}`;
                alert(`העלאה ל-Firebase Storage נכשלה. ${details}`);
            } finally {
                button.disabled = false;
                button.innerHTML = original;
            }
        };

        window.copyPublicLink = function(button) {
            const input = button.closest('.public-link-row')?.querySelector('.public-link-input');
            const status = button.closest('.public-link-box')?.querySelector('.public-link-status');
            const url = input?.value?.trim();
            if (!url) {
                if (status) status.textContent = 'אין קישור להעתקה עדיין.';
                return;
            }
            navigator.clipboard.writeText(url).then(() => {
                const original = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check"></i> הועתק קישור';
                if (status) status.textContent = 'הקישור הועתק ללוח בהצלחה.';
                setTimeout(() => button.innerHTML = original, 1600);
            });
        };

        window.showQrForLink = function(button) {
            const input = button.closest('.public-link-row')?.querySelector('.public-link-input');
            const url = input?.value?.trim();
            if (!url) return;
            openQrBanner(url);
        };

        window.createPublicLinkFromPanel = async function(index, button) {
            const file = (window.__htmlExports || [])[index];
            if (!file) return;
            const status = document.getElementById(`panel-public-status-${index}`);
            const input = document.getElementById(`panel-public-link-${index}`);
            const row = input?.closest('.public-link-row');
            const copyBtn = row?.querySelector('button:nth-of-type(1)');
            const qrBtn = row?.querySelector('button:nth-of-type(2)');

            if (!currentUser) {
                if (status) status.textContent = 'אין משתמש מחובר. התחבר/י כדי ליצור קישור ציבורי.';
                return;
            }

            const original = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מעלה...';
            if (status) status.textContent = 'מעלה את הקובץ ל-Firebase Storage...';

            try {
                const publicUrl = await uploadHtmlToFirebaseStorage(file.content, currentUser.uid);
                const panelKey = `panel-${simpleHash(file.content)}`;
                htmlPublicLinks.set(panelKey, publicUrl);
                if (input) input.value = publicUrl;
                if (copyBtn) copyBtn.disabled = false;
                if (qrBtn) qrBtn.disabled = false;
                if (status) status.textContent = 'הקישור הציבורי נוצר בהצלחה.';
            } catch (error) {
                console.error('Panel public link failed:', error);
                if (status) status.textContent = 'שגיאה בהעלאת הקובץ. נסה/י שוב.';
            } finally {
                button.disabled = false;
                button.innerHTML = original;
            }
        };

        window.copyPublicLinkFromPanel = function(index, button) {
            const input = document.getElementById(`panel-public-link-${index}`);
            const status = document.getElementById(`panel-public-status-${index}`);
            const url = input?.value?.trim();
            if (!url) return;
            navigator.clipboard.writeText(url).then(() => {
                const original = button.innerHTML;
                button.innerHTML = '<i class="fa-solid fa-check"></i> הועתק קישור';
                if (status) status.textContent = 'הקישור הועתק ללוח.';
                setTimeout(() => button.innerHTML = original, 1600);
            });
        };

        window.showQrFromPanel = function(index) {
            const input = document.getElementById(`panel-public-link-${index}`);
            const url = input?.value?.trim();
            if (!url) return;
            openQrBanner(url);
        };

        function openQrBanner(url) {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=440x440&data=${encodeURIComponent(url)}`;
            qrBannerImage.src = qrUrl;
            qrBannerLink.textContent = url;
            qrBanner.classList.add('show');
        }

        window.closeQrBanner = function(event) {
            if (event && event.target !== qrBanner && !event.target.closest('.ghost-btn')) return;
            qrBanner.classList.remove('show');
        };

        async function signInWithGoogle() {
            try {
                setAuthLoading(true);
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error(error);
                alert('התחברות נכשלה. ודא ש-Google Sign-In פעיל ב-Firebase Authentication.');
            } finally {
                setAuthLoading(false);
            }
        }

        function getEmailPasswordValues() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                authStatus.textContent = 'נא למלא גם אימייל וגם סיסמה.';
                return null;
            }
            return { email, password };
        }

        function setAuthLoading(isLoading) {
            [loginButton, emailLoginButton, emailSignupButton].forEach((button) => {
                button.disabled = isLoading;
                button.classList.toggle('opacity-60', isLoading);
                button.classList.toggle('cursor-not-allowed', isLoading);
            });
        }

        async function signInWithEmailPassword() {
            const credentials = getEmailPasswordValues();
            if (!credentials) return;
            authStatus.textContent = 'מתחבר...';
            try {
                setAuthLoading(true);
                await signInWithEmailAndPassword(auth, credentials.email, credentials.password);
                authStatus.textContent = '';
            } catch (error) {
                console.error(error);
                authStatus.textContent = 'התחברות נכשלה. בדוק אימייל/סיסמה ונסה שוב.';
            } finally {
                setAuthLoading(false);
            }
        }

        async function signUpWithEmailPassword() {
            const credentials = getEmailPasswordValues();
            if (!credentials) return;
            authStatus.textContent = 'נרשם...';
            try {
                setAuthLoading(true);
                await createUserWithEmailAndPassword(auth, credentials.email, credentials.password);
                authStatus.textContent = '';
            } catch (error) {
                console.error(error);
                authStatus.textContent = 'ההרשמה נכשלה. ודא שהסיסמה כוללת לפחות 6 תווים.';
            } finally {
                setAuthLoading(false);
            }
        }

        async function logout() {
            await signOut(auth);
        }

        loginButton.addEventListener('click', signInWithGoogle);
        emailLoginButton.addEventListener('click', signInWithEmailPassword);
        emailSignupButton.addEventListener('click', signUpWithEmailPassword);
        fileInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files || []);
            pendingUploads = [...pendingUploads, ...files];
            renderUploadPreview();
            fileInput.value = '';
        });
        document.addEventListener('click', () => {
            if (openMenuChatId) {
                openMenuChatId = null;
                renderChatList();
            }
        });
        [emailInput, passwordInput].forEach((field) => {
            field.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    signInWithEmailPassword();
                }
            });
        });
        logoutButton.addEventListener('click', logout);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            stopSpeechRecognition();
            sendMessage();
        });
        micButton.addEventListener('click', () => {
            if (isRecording) {
                stopSpeechRecognition();
            } else {
                startSpeechRecognition();
            }
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            pendingByChat.clear();

            if (!user) {
                chats = [];
                activeChatId = null;
                chatList.innerHTML = '';
                chatsCount.textContent = '0';
                renderWelcome();
                authBanner.classList.remove('hidden');
                appShell.classList.add('hidden');
                userChip.classList.add('hidden');
                logoutButton.classList.add('hidden');
                userEmail.textContent = '';
                if (unsubscribeChats) unsubscribeChats();
                return;
            }

            authBanner.classList.add('hidden');
            appShell.classList.remove('hidden');
            userChip.classList.remove('hidden');
            logoutButton.classList.remove('hidden');
            userEmail.textContent = user.email || 'משתמש מחובר';
            subscribeToChats();
        });

        window.toggleMenu = toggleMenu;
        window.switchChat = switchChat;
        window.createNewChat = createNewChat;
        window.clearChat = clearChat;
        window.openSettings = openSettings;
        window.openContact = openContact;
        window.openPremium = openPremium;
        window.duplicateCurrentChat = duplicateCurrentChat;
        window.shareChat = shareChat;
        window.shareSpecificChat = shareSpecificChat;
        window.toggleChatMenu = toggleChatMenu;
        window.deleteChatById = deleteChatById;
        window.triggerFileUpload = triggerFileUpload;
        window.openHtmlFilesPanel = openHtmlFilesPanel;
        window.closeHtmlFilesPanel = closeHtmlFilesPanel;
        window.downloadHtmlFromPanel = downloadHtmlFromPanel;
    </script>
</body>
</html>
