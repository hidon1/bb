<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>גלריה מרכזית</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: white;
      overflow-x: hidden;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 10px;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .carousel {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 460px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item {
      position: absolute;
      width: 260px;
      height: 360px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      transition: all 0.55s ease;
      opacity: 0;
      transform: scale(0.7);
      background: #111827;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item.center {
      width: 420px;
      height: 460px;
      transform: translateX(0) scale(1);
      opacity: 1;
      z-index: 5;
    }

    .item.left1 {
      transform: translateX(-290px) scale(0.86);
      opacity: 0.9;
      z-index: 4;
    }

    .item.right1 {
      transform: translateX(290px) scale(0.86);
      opacity: 0.9;
      z-index: 4;
    }

    .item.left2 {
      transform: translateX(-500px) scale(0.72);
      opacity: 0.5;
      z-index: 3;
    }

    .item.right2 {
      transform: translateX(500px) scale(0.72);
      opacity: 0.5;
      z-index: 3;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 24px;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .prev { right: 20px; }
    .next { left: 20px; }

    .nav:hover {
      background: rgba(255,255,255,0.26);
    }

    @media (max-width: 900px) {
      .carousel { height: 370px; }
      .item.center { width: 300px; height: 360px; }
      .item { width: 180px; height: 250px; }
      .item.left1 { transform: translateX(-170px) scale(0.82); }
      .item.right1 { transform: translateX(170px) scale(0.82); }
      .item.left2 { transform: translateX(-290px) scale(0.65); }
      .item.right2 { transform: translateX(290px) scale(0.65); }
    }

    @media (max-width: 600px) {
      .item.left2, .item.right2 { display: none; }
      .item.left1 { transform: translateX(-120px) scale(0.72); opacity: 0.45; }
      .item.right1 { transform: translateX(120px) scale(0.72); opacity: 0.45; }
      .item.center { width: 240px; height: 310px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>גלריה עם תמונה מרכזית גדולה</h1>

    <div class="carousel">
      <button class="nav prev" id="prev2">❯</button>
      <button class="nav next" id="next2">❮</button>

      <div class="item"><img src="https://picsum.photos/id/1040/800/1000"></div>
      <div class="item"><img src="https://picsum.photos/id/1041/800/1000"></div>
      <div class="item"><img src="https://picsum.photos/id/1042/800/1000"></div>
      <div class="item"><img src="https://picsum.photos/id/1043/800/1000"></div>
      <div class="item"><img src="https://picsum.photos/id/1044/800/1000"></div>
      <div class="item"><img src="https://picsum.photos/id/1045/800/1000"></div>
    </div>
  </div>

  <script>
    const items2 = [...document.querySelectorAll('.item')];
    let current2 = 0;

    function render2() {
      items2.forEach(item => item.className = 'item');

      const len = items2.length;
      const center = current2;
      const left1 = (current2 - 1 + len) % len;
      const right1 = (current2 + 1) % len;
      const left2 = (current2 - 2 + len) % len;
      const right2 = (current2 + 2) % len;

      items2[center].classList.add('center');
      items2[left1].classList.add('left1');
      items2[right1].classList.add('right1');
      items2[left2].classList.add('left2');
      items2[right2].classList.add('right2');
    }

    document.getElementById('prev2').onclick = () => {
      current2 = (current2 - 1 + items2.length) % items2.length;
      render2();
    };

    document.getElementById('next2').onclick = () => {
      current2 = (current2 + 1) % items2.length;
      render2();
    };

    render2();
  </script>
</body>
</html>
