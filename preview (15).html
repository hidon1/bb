<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>גלריית קלפים</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #0f172a);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: white;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    h2 {
      margin-bottom: 28px;
      font-size: 2rem;
    }

    .stack {
      position: relative;
      height: 500px;
      max-width: 500px;
      margin: auto;
    }

    .card {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
      transition: all 0.5s ease;
      transform-origin: center;
      background: #1f2937;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lvl0 {
      transform: translateY(0) scale(1);
      z-index: 5;
      opacity: 1;
    }

    .lvl1 {
      transform: translateY(18px) scale(0.94);
      z-index: 4;
      opacity: 0.8;
    }

    .lvl2 {
      transform: translateY(36px) scale(0.88);
      z-index: 3;
      opacity: 0.55;
    }

    .hidden {
      transform: translateY(52px) scale(0.82);
      z-index: 2;
      opacity: 0;
    }

    .buttons {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .buttons button {
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      background: rgba(255,255,255,0.16);
      color: white;
    }

    .buttons button:hover {
      background: rgba(255,255,255,0.26);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h2>גלריית קלפים</h2>

    <div class="stack" id="stack5">
      <div class="card"><img src="https://picsum.photos/id/1070/900/1200"></div>
      <div class="card"><img src="https://picsum.photos/id/1071/900/1200"></div>
      <div class="card"><img src="https://picsum.photos/id/1072/900/1200"></div>
      <div class="card"><img src="https://picsum.photos/id/1073/900/1200"></div>
      <div class="card"><img src="https://picsum.photos/id/1074/900/1200"></div>
    </div>

    <div class="buttons">
      <button id="prev5">❯</button>
      <button id="next5">❮</button>
    </div>
  </div>

  <script>
    const cards5 = [...document.querySelectorAll('#stack5 .card')];
    let current5 = 0;

    function render5() {
      cards5.forEach(card => card.className = 'card');

      const len = cards5.length;
      cards5[current5].classList.add('lvl0');
      cards5[(current5 + 1) % len].classList.add('lvl1');
      cards5[(current5 + 2) % len].classList.add('lvl2');

      for (let i = 3; i < len; i++) {
        cards5[(current5 + i) % len].classList.add('hidden');
      }
    }

    document.getElementById('next5').onclick = () => {
      current5 = (current5 + 1) % cards5.length;
      render5();
    };

    document.getElementById('prev5').onclick = () => {
      current5 = (current5 - 1 + cards5.length) % cards5.length;
      render5();
    };

    render5();
  </script>
</body>
</html>
